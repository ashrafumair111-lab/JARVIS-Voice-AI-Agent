<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="JARVIS AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/><stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fdcff"/><stop offset="1" stop-color="#2f8fe0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eaffff"/><stop offset="0.35" stop-color="#6fd4ff"/><stop offset="1" stop-color="#0a2c4a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="200" rx="18" fill="url(#bg)" stroke="#1d3450" stroke-width="1.5"/>
  <g transform="translate(105,100)" filter="url(#glow)">
    <circle r="62" fill="none" stroke="#2f8fe0" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="50" fill="none" stroke="#3aa6ff" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="30 12"/>
    <circle r="36" fill="none" stroke="#6fd4ff" stroke-width="4" stroke-dasharray="8 6"/>
    <circle r="22" fill="url(#core)"/>
    <circle r="8" fill="#ffffff"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="205" y="100" font-size="62" font-weight="700" letter-spacing="13" fill="url(#txt)">JARVIS</text>
    <text x="209" y="136" font-size="18" letter-spacing="8" fill="#8fb6d2">AI VOICE ASSISTANT</text>
    <rect x="209" y="150" width="150" height="3" rx="1.5" fill="#2f8fe0"/>
  </g>
</svg>

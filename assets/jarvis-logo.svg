<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="JARVIS AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/><stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fdcff"/><stop offset="1" stop-color="#2f8fe0"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset="0.3" stop-color="#7fdcff"/>
      <stop offset="0.65" stop-color="#1f7fd0"/>
      <stop offset="1" stop-color="#062038"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fd4ff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#9fe8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6fd4ff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="200" rx="18" fill="url(#bg)" stroke="#1d3450" stroke-width="1.5"/>

  <!-- JARVIS 3D gyro-eye emblem -->
  <g transform="translate(105,100)">
    <circle r="70" fill="none" stroke="#2f8fe0" stroke-opacity="0.18" stroke-width="1"/>

    <!-- ring 1: equatorial, spins clockwise -->
    <g filter="url(#glow)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <ellipse rx="64" ry="20" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" stroke-dasharray="150 60 90 999"/>
      </g>
    </g>

    <!-- ring 2: tilted 60°, spins counter-clockwise -->
    <g transform="rotate(60)" filter="url(#glow)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/>
        <ellipse rx="64" ry="20" fill="none" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" stroke-dasharray="110 80 130 999"/>
      </g>
    </g>

    <!-- ring 3: tilted -60°, slow clockwise spin -->
    <g transform="rotate(-60)" filter="url(#glow)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="17s" repeatCount="indefinite"/>
        <ellipse rx="60" ry="17" fill="none" stroke="#3aa6ff" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="40 24 90 999"/>
      </g>
    </g>

    <!-- the eye -->
    <circle r="30" fill="url(#iris)" stroke="#0a2c4a" stroke-width="2" filter="url(#glow)"/>
    <circle r="30" fill="none" stroke="#9fe8ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="11" fill="#020a14">
      <animate attributeName="r" values="11;12.5;11" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-4" cy="-5" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="205" y="100" font-size="62" font-weight="700" letter-spacing="13" fill="url(#txt)">JARVIS</text>
    <text x="209" y="136" font-size="18" letter-spacing="8" fill="#8fb6d2">AI VOICE ASSISTANT</text>
    <rect x="209" y="150" width="150" height="3" rx="1.5" fill="#2f8fe0">
      <animate attributeName="width" values="150;210;150" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
